id: rawdenoise-okeinla
name: "Okeinla"
description: "Bayer RAW denoising and demosaicing with NAFNet"
task: rawdenoise
version: "1.0"
arch: nafnet
backend: onnx
tiling: true
type: multi
dep_group: rawnind
coreml_format: mlprogram

attributes:
  input_sizes: [512]
  model_bayer:
    input_kind: bayer_v1
    bayer_orientation: force_rggb
    edge_pad: mirror_cropped
    wb_norm: none
    output_scale: match_gain

checkpoints:
  - url: "https://huggingface.co/AyedaOk/okeinla/resolve/7d4480d305ac9a425832afb9c110ee0b1af0200a/onnx/model_bayer.onnx"
    path: "output/rawdenoise-okeinla/model_bayer.onnx"
  - url: "https://raw.githubusercontent.com/AyedaOk/okeinla/a9efc414d65fe6bd4be1c4e882be757263740d0c/LICENSE"
    path: "output/rawdenoise-okeinla/LICENSE"
  - url: "https://raw.githubusercontent.com/AyedaOk/okeinla/a9efc414d65fe6bd4be1c4e882be757263740d0c/licenses/NAFNet-MIT.txt"
    path: "output/rawdenoise-okeinla/NAFNet-MIT.txt"

model_card:
  long_description: "Okeinla 1.0 jointly denoises and demosaics Bayer RAW images using a NAFNet adapted from RawNIND."
  scope: "Bayer RAW denoising and demosaicing"
  author: "Ayeda Okambawa"
  source: "https://github.com/AyedaOk/okeinla"
  license: "GPL-3.0-only"
  training_data: "RawNIND and Okeinla dataset: paired noisy and reference RAW photographs."
  training_data_license: "CC-BY-SA-4.0"
  notes: "Bayer only; no X-Trans or linear-RGB variant."
